services:
  pdf2xml-api:
    build: .
    init: true
    ports:
      - "8087:8087"
    volumes:
      - ./out:/app/out
    environment:
      PDF2XML_DATA: /app/out
      PDF2XML_MAX_UPLOAD_MB: "${PDF2XML_MAX_UPLOAD_MB:-1024}"
      PDF2XML_MAX_PENDING: "${PDF2XML_MAX_PENDING:-32}"
      PDF2XML_JOB_TIMEOUT_S: "${PDF2XML_JOB_TIMEOUT_S:-1800}"
      PDF2XML_RETENTION_HOURS: "${PDF2XML_RETENTION_HOURS:-24}"
      PDF2XML_MAX_PAGES: "${PDF2XML_MAX_PAGES:-1000}"
      PDF2XML_API_KEYS: "${PDF2XML_API_KEYS:-{}}"
      PDF2XML_ALLOW_ANONYMOUS: "${PDF2XML_ALLOW_ANONYMOUS:-1}"
      PDF2XML_CORS_ORIGINS: "${PDF2XML_CORS_ORIGINS:-}"
      PDF2XML_MODELS_DIR: /app/models
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    mem_limit: 8g
    cpus: "4.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
