global:
  scrape_interval: 30s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: pdf2xml
    metrics_path: /metrics/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/secrets/pdf2xml_monitor_token
    static_configs:
      - targets: ['127.0.0.1:8087']
    # Configure one scrape job per tenant token; never use anonymous production access.
