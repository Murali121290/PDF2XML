[project]
name = "pdf2xml"
version = "0.5.6"
description = "Convert born-digital PDFs to canonical JSON/XML, EPUB 3 and DOCX, keeping structure and styles."
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",          # MIT
    "pdfplumber>=0.11",       # MIT
    "pypdfium2>=4.30",        # Apache-2.0 / BSD-3
    "pikepdf>=9.0",           # MPL-2.0
    "lxml>=5.2",              # BSD
    "saxonche>=12.5",         # MPL-2.0
    "python-docx>=1.1",       # MIT
    "typer>=0.12",            # MIT
    "pillow>=10.0",           # MIT-CMU
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",            # MIT — export profiles and metadata files
]

[project.optional-dependencies]
ml = ["docling==2.150.0"]         # MIT (pulls torch)
test = ["pytest>=8.0", "httpx>=0.28", "psutil>=7.0"]

[project.scripts]
pdf2xml = "pdf2xml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2xml"]

